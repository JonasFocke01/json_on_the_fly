[package]
name = "json-on-the-fly"
version = "0.2.3"
edition = "2021"
description = "Store structs in json files on the fly and remove all boilerplate for (de-)serialization"
license-file = "../LICENSE"
readme = "../README.md"
repository = "https://github.com/JonasFocke01/json_on_the_fly/"
documentation = "https://docs.rs/json-on-the-fly/latest/json_on_the_fly/"
categories = ["parsing", "os", "filesystem", "development-tools"]
keywords = ["json", "file", "save", "quick", "no-boilerplate"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
json-on-the-fly-derive = "0.1"
