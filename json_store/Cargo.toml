[package]
name = "json-store"
version = "0.1.2"
edition = "2021"
description = "Store structs in json files on the fly and remove all boilerplate for (de-)serialization"
license-file = "../LICENSE"
readme = "../README.md"
repository = "https://github.com/JonasFocke01/json_store_rs/"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
json-store-derive = "0.1"
